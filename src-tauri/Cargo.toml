[package]
name = "lexora"
version = "0.4.1"
description = "Lexora desktop shell: selection translator for Windows"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.55"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
rdev = "0.5"
zip = { version = "2", default-features = false, features = ["deflate"] }
# Screenshot capture + on-device OCR + screenshot tools. `wgc` captures through
# Windows Graphics Capture, so `WDA_EXCLUDEFROMCAPTURE` is honored (the open
# settings/picker windows stay out of the frozen screenshot, contract §10.1) and
# hardware-composited content is not grabbed as black.
xcap = { version = "0.9", features = ["wgc"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
native-ocr = "0.2"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_Accessibility",
  "UI_UIAutomation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_HiDpi",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_System_SystemInformation",
  "Win32_System_JobObjects",
  "Win32_Security",
  "Win32_Globalization",
  "Win32_System_Time"
] }

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
