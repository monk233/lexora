<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src ipc: http://ipc.localhost">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Lexora</title>
  <link rel="stylesheet" href="picker.css">
</head>
<body>
  <div class="picker" id="picker">
    <div class="toolbar" id="toolbar" role="toolbar" aria-label="划词工具"></div>
    <div class="panel" id="panel" hidden>
      <div class="panel-head" id="panel-head">
        <div class="panel-head-title">
          <span class="panel-title" id="panel-title">翻译</span>
          <div class="panel-lang-control" id="panel-lang-control" hidden>
            <span class="panel-lang-auto">自动识别</span>
            <span class="panel-lang-arrow" aria-hidden="true">→</span>
            <!-- Options are generated from window.LP.LANGUAGES in picker.js. -->
            <select id="panel-target-lang" class="panel-target-lang" aria-label="目标语言"></select>
          </div>
        </div>
        <div class="panel-head-actions">
          <button type="button" class="icon-btn" id="panel-pin" title="固定到桌面" aria-label="固定到桌面" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 17v5"></path>
              <path d="M9 10.8V4h6v6.8l2.5 3.2h-11L9 10.8z"></path>
            </svg>
          </button>
          <button type="button" class="icon-btn" id="panel-close" title="关闭" aria-label="关闭">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M18 6 6 18"></path>
              <path d="m6 6 12 12"></path>
            </svg>
          </button>
        </div>
      </div>
      <div class="panel-body" id="panel-body"></div>
      <div class="panel-followup" id="panel-followup" hidden>
        <div class="panel-suggestions" id="panel-suggestions" hidden></div>
        <div class="panel-followup-row">
          <input type="text" class="panel-followup-input" id="panel-followup-input"
                 placeholder="继续提问…" autocomplete="off" aria-label="继续提问">
          <button type="button" class="panel-followup-send" id="panel-followup-send">发送</button>
        </div>
      </div>
      <div class="panel-foot" id="panel-foot">
        <button type="button" class="panel-foot-btn" id="panel-speak">朗读</button>
        <button type="button" class="panel-foot-btn" id="panel-copy">复制</button>
        <button type="button" class="panel-foot-btn" id="panel-retry">重试</button>
      </div>
      <div class="panel-resize-grip" id="panel-resize-grip" role="separator"
           aria-label="调整面板大小" title="拖动调整大小 · 双击恢复自动大小"></div>
    </div>
    <div class="menu" id="menu" hidden role="menu"></div>
    <div class="toast" id="toast" hidden></div>
  </div>
  <script src="shared/constants.js"></script>
  <script src="shared/skill-icons.js"></script>
  <script src="shared/lang.js"></script>
  <script src="shared/markdown.js"></script>
  <script src="shared/tauri-api.js"></script>
  <script src="picker.js"></script>
</body>
</html>
