<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src ipc: http://ipc.localhost">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lexora 钉图</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="pin.css">
</head>
<body>
  <div class="pin-root" id="pin-root">
    <img class="pin-image" id="pin-image" alt="" draggable="false" hidden>
    <!-- Edit mode: transparent annotation layer above the image. -->
    <canvas class="pin-edit-canvas" id="pin-edit-canvas" hidden aria-hidden="true"></canvas>

    <!-- Hover toolbar (icon buttons): edit / copy / close (contract §11.5). -->
    <div class="pin-toolbar" id="pin-toolbar" hidden>
      <button type="button" class="pin-btn" id="pin-edit" title="编辑（标注 / 图片技能，Esc 退出）"
              aria-label="编辑">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 20h9"></path>
          <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"></path>
        </svg>
      </button>
      <button type="button" class="pin-btn" id="pin-copy" title="复制图片" aria-label="复制图片">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="9" y="9" width="11" height="11" rx="2"></rect>
          <path d="M5 15V5a2 2 0 0 1 2-2h10"></path>
        </svg>
      </button>
      <button type="button" class="pin-btn pin-btn-close" id="pin-close" title="关闭（Esc）" aria-label="关闭">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 6 6 18"></path>
          <path d="m6 6 12 12"></path>
        </svg>
      </button>
    </div>

    <div class="pin-toast" id="pin-toast" role="status" aria-live="polite" hidden></div>

    <!-- Mouse-wheel zoom percentage (fades out after a moment). -->
    <div class="pin-zoom" id="pin-zoom" role="status" aria-live="polite" hidden></div>

    <div class="pin-error" id="pin-error" role="alert" hidden>
      <span class="pin-error-text" id="pin-error-text">钉图加载失败</span>
      <button type="button" class="pin-error-btn" id="pin-error-close">关闭</button>
    </div>

    <!-- Edit-mode toolbar: same component design as the screenshot toolbar (white
         card, icon + label). Annotation tools, image skills (including custom
         image skills), undo/redo and cancel/confirm. Esc leaves the edit mode. -->
    <div class="pin-edit-bar" id="pin-edit-bar" role="toolbar" aria-label="图片编辑" hidden>
      <button type="button" class="tool-btn pin-edit-shape" data-edit-tool="shape"
              title="形状（矩形 / 圆形 / 直线）" aria-pressed="false">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="2"></rect>
        </svg>
        <span class="label">形状</span>
      </button>
      <button type="button" class="tool-btn" data-edit-tool="arrow" title="箭头" aria-pressed="false">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M7 7h10v10"></path>
          <path d="M7 17 17 7"></path>
        </svg>
        <span class="label">箭头</span>
      </button>
      <button type="button" class="tool-btn" data-edit-tool="pen" title="画笔" aria-pressed="false">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path>
          <path d="m15 5 4 4"></path>
        </svg>
        <span class="label">画笔</span>
      </button>
      <button type="button" class="tool-btn" data-edit-tool="text" title="文字" aria-pressed="false">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 4v16"></path>
          <path d="M4 7V5a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v2"></path>
          <path d="M9 20h6"></path>
        </svg>
        <span class="label">文字</span>
      </button>
      <button type="button" class="tool-btn" data-edit-tool="number" title="序号" aria-pressed="false">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="4" x2="20" y1="9" y2="9"></line>
          <line x1="4" x2="20" y1="15" y2="15"></line>
          <line x1="10" x2="8" y1="3" y2="21"></line>
          <line x1="16" x2="14" y1="3" y2="21"></line>
        </svg>
        <span class="label">序号</span>
      </button>
      <button type="button" class="tool-btn" data-edit-tool="mosaic" title="马赛克" aria-pressed="false">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect width="18" height="18" x="3" y="3" rx="2"></rect>
          <path d="M3 9h18"></path>
          <path d="M3 15h18"></path>
          <path d="M9 3v18"></path>
          <path d="M15 3v18"></path>
        </svg>
        <span class="label">马赛克</span>
      </button>

      <span class="bar-sep" aria-hidden="true"></span>

      <button type="button" class="tool-btn" data-edit-skill="ocr" title="提取图片中的文字">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 7V5a2 2 0 0 1 2-2h2"></path>
          <path d="M17 3h2a2 2 0 0 1 2 2v2"></path>
          <path d="M21 17v2a2 2 0 0 1-2 2h-2"></path>
          <path d="M7 21H5a2 2 0 0 1-2-2v-2"></path>
          <path d="M7 8h10"></path>
          <path d="M7 12h10"></path>
          <path d="M7 16h6"></path>
        </svg>
        <span class="label">提取文字</span>
      </button>
      <button type="button" class="tool-btn" data-edit-skill="translate" title="翻译图片中的文字">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m5 8 6 6"></path>
          <path d="m4 14 6-6 2-3"></path>
          <path d="M2 5h12"></path>
          <path d="M7 2h1"></path>
          <path d="m22 22-5-10-5 10"></path>
          <path d="M14 18h6"></path>
        </svg>
        <span class="label">翻译</span>
      </button>
      <button type="button" class="tool-btn" data-edit-skill="explain" title="用 AI 解释图片内容">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path>
          <path d="M9 18h6"></path>
          <path d="M10 22h4"></path>
        </svg>
        <span class="label">解释图片</span>
      </button>
      <span class="pin-edit-custom-skills" id="pin-edit-custom-skills"></span>

      <span class="bar-sep" aria-hidden="true"></span>

      <button type="button" class="tool-btn tool-btn-icon" id="pin-edit-undo"
              data-edit-action="undo" title="撤回（Ctrl+Z）" aria-label="撤回" disabled>
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 7v6h6"></path>
          <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"></path>
        </svg>
      </button>
      <button type="button" class="tool-btn tool-btn-icon" id="pin-edit-redo"
              data-edit-action="redo" title="重做（Ctrl+Y）" aria-label="重做" disabled>
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 7v6h-6"></path>
          <path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3l3 2.7"></path>
        </svg>
      </button>

      <span class="bar-sep" aria-hidden="true"></span>

      <button type="button" class="tool-btn tool-btn-danger" data-edit-action="cancel"
              title="取消编辑（Esc，丢弃标注）">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 6 6 18"></path>
          <path d="m6 6 12 12"></path>
        </svg>
        <span class="label">取消</span>
      </button>
      <button type="button" class="tool-btn tool-btn-confirm" data-edit-action="exit"
              title="确认并退出编辑（保存标注并复制到剪贴板）">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 6 9 17l-5-5"></path>
        </svg>
        <span class="label">确认</span>
      </button>
    </div>

    <!-- Shape picker opened by the 形状 button. -->
    <div class="pin-shape-menu" id="pin-shape-menu" role="menu" aria-label="形状" hidden>
      <button type="button" data-edit-shape="rect" title="矩形">矩形</button>
      <button type="button" data-edit-shape="circle" title="圆形">圆形</button>
      <button type="button" data-edit-shape="line" title="直线">直线</button>
    </div>

    <!-- Right-click menu (copy / close). -->
    <div class="pin-menu" id="pin-context-menu" role="menu" hidden>
      <button type="button" class="pin-menu-item" data-pin-action="copy" role="menuitem">复制</button>
      <button type="button" class="pin-menu-item" data-pin-action="close" role="menuitem">关闭</button>
    </div>
  </div>

  <script src="shared/tauri-api.js"></script>
  <script src="shared/skill-icons.js"></script>
  <script src="capture-annotate.js"></script>
  <script src="pin.js"></script>
</body>
</html>
