<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src ipc: http://ipc.localhost">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Lexora 快捷翻译</title>
  <link rel="stylesheet" href="quicktranslate.css">
</head>
<body>
  <div class="qt-app" id="qt-app">
    <!-- Top bar: auto-detected source language -> target language, swap, pin,
         history. Every visible string is Chinese, matching the rest of the UI. -->
    <header class="qt-topbar">
      <div class="qt-langbar">
        <span class="qt-lang-label">语言</span>
        <span class="qt-lang-auto" title="源语言自动识别">自动识别</span>
        <span class="qt-lang-arrow" aria-hidden="true">→</span>
        <!-- Options are generated from window.LP.LANGUAGES in quicktranslate.js. -->
        <select class="qt-select" id="qt-target-lang" aria-label="目标语言"></select>
        <button type="button" class="qt-icon-btn" id="qt-swap"
                title="交换：以检测到的源语言为目标语言" aria-label="交换语言">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 8h13"></path>
            <path d="m14 5 3 3-3 3"></path>
            <path d="M20 16H7"></path>
            <path d="m10 13-3 3 3 3"></path>
          </svg>
        </button>
      </div>
      <div class="qt-topbar-actions">
        <button type="button" class="qt-icon-btn" id="qt-pin" title="置顶显示"
                aria-label="置顶显示" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 17v5"></path>
            <path d="M9 10.8V4h6v6.8l2.5 3.2h-11L9 10.8z"></path>
          </svg>
        </button>
        <button type="button" class="qt-btn qt-btn-ghost qt-history-toggle" id="qt-history-toggle"
                aria-haspopup="dialog" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M12 7v5l3 2"></path>
          </svg>
          <span>历史</span>
        </button>
      </div>
    </header>

    <main class="qt-body">
      <section class="qt-card" aria-labelledby="qt-source-title">
        <div class="qt-card-head">
          <h2 class="qt-card-title" id="qt-source-title">原文</h2>
          <div class="qt-card-actions">
            <span class="qt-count" id="qt-source-count">0 / 20000 字符</span>
            <button type="button" class="qt-btn qt-btn-ghost qt-btn-small" id="qt-source-clear">清空</button>
          </div>
        </div>
        <div class="qt-card-body">
          <textarea class="qt-textarea" id="qt-source" maxlength="20000" spellcheck="false"
                    placeholder="输入或粘贴要翻译的文本…" aria-label="原文"></textarea>
          <div class="qt-card-foot">
            <span class="qt-hint" id="qt-limit-hint">支持 38 种语言，最多 20000 字符</span>
            <div class="qt-foot-actions">
              <kbd class="qt-kbd">Ctrl+Enter</kbd>
              <button type="button" class="qt-btn qt-btn-primary" id="qt-translate">翻译</button>
            </div>
          </div>
        </div>
      </section>

      <section class="qt-card" aria-labelledby="qt-result-title">
        <div class="qt-card-head">
          <h2 class="qt-card-title" id="qt-result-title">译文</h2>
          <div class="qt-card-actions">
            <span class="qt-count" id="qt-result-count">0 字符</span>
            <button type="button" class="qt-btn qt-btn-ghost qt-btn-small" id="qt-copy" disabled>复制</button>
          </div>
        </div>
        <div class="qt-card-body">
          <div class="qt-result markdown" id="qt-result" data-state="empty" aria-live="polite">
            <div class="qt-empty">
              <p class="qt-empty-title">译文会显示在这里</p>
              <p class="qt-empty-hint">按 Ctrl+Enter 或点击「翻译」</p>
            </div>
          </div>
          <div class="qt-result-error" id="qt-result-error" hidden></div>
          <div class="qt-card-foot qt-card-foot-result">
            <span class="qt-hint" id="qt-elapsed">耗时 —</span>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- History overlay: original/translation summaries, search, delete, clear. -->
  <div class="qt-overlay" id="qt-history-overlay" hidden>
    <div class="qt-history" role="dialog" aria-modal="true" aria-labelledby="qt-history-title">
      <div class="qt-history-head">
        <h2 class="qt-history-title" id="qt-history-title">翻译历史</h2>
        <button type="button" class="qt-icon-btn" id="qt-history-close" title="关闭" aria-label="关闭历史">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 6 6 18"></path>
            <path d="m6 6 12 12"></path>
          </svg>
        </button>
      </div>
      <div class="qt-history-search">
        <input type="search" class="qt-input" id="qt-history-search"
               placeholder="搜索原文或译文…" autocomplete="off" aria-label="搜索翻译历史">
      </div>
      <div class="qt-history-list" id="qt-history-list" role="list"></div>
      <div class="qt-history-foot">
        <span class="qt-hint" id="qt-history-summary">暂无翻译历史</span>
        <button type="button" class="qt-btn qt-btn-danger qt-btn-small" id="qt-history-clear" disabled>清空历史</button>
      </div>
    </div>
  </div>

  <div class="qt-toast-stack" id="qt-toast-stack" aria-live="polite"></div>

  <script src="shared/constants.js"></script>
  <script src="shared/lang.js"></script>
  <script src="shared/markdown.js"></script>
  <script src="shared/tauri-api.js"></script>
  <script src="quicktranslate.js"></script>
</body>
</html>
