<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src ipc: http://ipc.localhost">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lexora 长截图</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="longshot.css">
</head>
<body>
  <!-- Minimal preview of the manual long screenshot (contract §11.14.1).
       Transparent frameless window: only the blue frame (same colour/weight as
       the screenshot selection border) around the stitched image. The shell
       sizes this window once; the picture scales to fit and gets narrower as the
       image grows. No header, footer, status pill, error banner or white card. -->
  <div class="longshot-root" id="longshot-root">
    <div class="longshot-frame" id="longshot-frame">
      <img class="longshot-image" id="longshot-image" alt="" draggable="false" hidden>
      <img class="longshot-image" id="longshot-image-buffer" alt="" draggable="false"
           aria-hidden="true" hidden>
    </div>
    <div class="longshot-empty" id="longshot-empty">正在拼接…</div>
  </div>

  <script src="shared/constants.js"></script>
  <script src="shared/messages.zh.js"></script>
  <script src="shared/messages.en.js"></script>
  <script src="shared/i18n.js"></script>
  <script src="shared/tauri-api.js"></script>
  <script src="longshot.js"></script>
</body>
</html>
