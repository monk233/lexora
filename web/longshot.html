<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src ipc: http://ipc.localhost">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lexora 长截图</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="longshot.css">
</head>
<body>
  <!-- Minimal growing preview of the manual long screenshot (contract
       §11.14.1). The shell sizes this window to the stitched aspect ratio, so
       the image simply fills the card; direction/cancel/finish live in the
       separate control bar below the selection. -->
  <div class="longshot-card" id="longshot-root">
    <div class="longshot-canvas">
      <img class="longshot-image" id="longshot-image" alt="" draggable="false" hidden>
      <img class="longshot-image" id="longshot-image-buffer" alt="" draggable="false"
           aria-hidden="true" hidden>
      <div class="longshot-empty" id="longshot-empty">正在拼接…</div>
    </div>
    <div class="longshot-meta" id="longshot-meta" hidden>0 × 0</div>
    <div class="longshot-error" id="longshot-error" role="alert" hidden>
      <span class="longshot-error-text" id="longshot-error-text"></span>
      <button type="button" class="longshot-error-close" id="longshot-error-close">关闭</button>
    </div>
    <div class="longshot-toast" id="longshot-toast" role="status" aria-live="polite" hidden></div>
  </div>

  <script src="shared/constants.js"></script>
  <script src="shared/tauri-api.js"></script>
  <script src="longshot.js"></script>
</body>
</html>
