name: CI

# Build & test only when a release tag is pushed (or manually dispatched):
# pushing to master/main must not start CI.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  pronunciation-linux:
    name: Linux offline pronunciation check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check and test the portable pronunciation module
        run: bash scripts/check-pronunciation.sh

  windows:
    name: Windows build & test
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-on-failure: true

      - name: Install npm dependencies
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) { npm ci } else { npm install }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check --all-targets

      - name: Cargo test
        working-directory: src-tauri
        run: cargo test

      - name: Build debug executable (no bundle)
        run: npx tauri build --debug --no-bundle

      - name: Upload debug executable
        uses: actions/upload-artifact@v4
        with:
          name: lexora-debug-exe
          path: src-tauri/target/debug/lexora.exe
          if-no-files-found: error
          retention-days: 7
